    <rect width="108" height="108" fill="#B71C1C"/>
  </g>
  <g id="karta">
    <rect x="35" y="30" width="38" height="50" rx="5" fill="#FFFFFF"/>
    <rect x="45" y="25" width="18" height="10" rx="3.5" fill="#FFB300"/>
  </g>
