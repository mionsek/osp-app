<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Logo Raportów OSP, wariant A: karta raportu z płomieniem (wybór Dawida
       11.11.2026). Płótno 108 × 108 jak ikona adaptacyjna Androida: launcher
       pokazuje środek 72 × 72, a wszystko ważne mieści się w kole Ø 66.
       Obrazki PNG dla Androida składa tool/osp_icons/build_logo.py — warstwy
       to grupy niżej: tło, karta i to, co w warstwie jednobarwnej jest
       wycięte z karty. Płomień: Material Icons local_fire_department. -->
